[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcvtc"
version = "0.1.0"
description = "Rare-Coding-Variant Target Characterization pipeline"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "requests-cache>=1.1",
  "pyyaml>=6.0",
  "pyarrow>=14",
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.83",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["rcvtc*"]
